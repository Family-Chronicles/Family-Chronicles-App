# Complete Family Chronicles stack: web app + server + MongoDB.
# Expects the server repository next to this one (../Family-Chronicles-Server),
# override with SERVER_PATH. Configure secrets in a .env file (see .env.example).
#
#   docker compose up --build      → http://localhost:8000

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:80"
    depends_on:
      - family-chronicles-server

  family-chronicles-server:
    build: ${SERVER_PATH:-../Family-Chronicles-Server}
    restart: unless-stopped
    environment:
      DB_DRIVER: mongo
      DB_HOST: mongodb://mongo:27017
      DB_USER: ${MONGO_USER:-admin}
      DB_PASSWORD: ${MONGO_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@family-chronicles.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (first start)}
    volumes:
      - uploads:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
  uploads:
